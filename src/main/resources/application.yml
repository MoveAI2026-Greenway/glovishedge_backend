spring:
  application:
    name: glovishedge-backend

  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:glovishedge}
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 8MB

sea-route:
  # PROVISIONAL(docs/PROVISIONAL_BACKEND_DECISIONS.md §A) — Node sidecar(searoute-service) 주소.
  base-url: ${SEA_ROUTE_BASE_URL:http://localhost:3001}

server:
  port: ${PORT:8080}